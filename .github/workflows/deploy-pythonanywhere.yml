
name: Deploy to PythonAnywhere (recursive upload)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PythonAnywhere secrets
        id: secrets
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
        run: |
          missing=""

          for v in PA_USERNAME PA_TOKEN PA_TARGET_DIR PA_WEBAPP_DOMAIN; do
            [[ -z "${!v}" ]] && missing="$missing $v"
          done

          if [[ -n "$missing" ]]; then
            echo "::warning::Secrets manquants :$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload all files recursively
        if: steps.secrets.outputs.ok == 'true'
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
          PA_HOST: ${{ secrets.PA_HOST }}

        run: |
          set -euo pipefail

          USER="$PA_USERNAME"
          TOKEN="$PA_TOKEN"
          TARGET_DIR="${PA_TARGET_DIR%/}"
          DOMAIN="$PA_WEBAPP_DOMAIN"

          HOST="${PA_HOST:-www.pythonanywhere.com}"

          echo "PythonAnywhere host: $HOST"
          echo "Target directory: $TARGET_DIR"

          # Vérification des chemins
          if [[ "$TARGET_DIR" != /home/* ]]; then
            echo "::error::PA_TARGET_DIR doit être un chemin absolu sous /home/"
            exit 1
          fi

          # Upload récursif
          while IFS= read -r -d '' file; do

            rel="${file#./}"

            # Exclusions
            case "$rel" in
              .git/*|.github/*|.venv/*|venv/*|__pycache__/*|node_modules/*)
                continue
                ;;
              .gitignore|*.pyc|.DS_Store)
                continue
                ;;
            esac

            remote_path="${TARGET_DIR}/${rel}"

            # Encodage URL du chemin
            encoded_path=$(python3 -c \
              'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' \
              "$remote_path")

            echo "Uploading: $rel"

            curl -sS --fail-with-body -X POST \
              -H "Authorization: Token ${TOKEN}" \
              -F "content=@${file}" \
              "https://${HOST}/api/v0/user/${USER}/files/path/${encoded_path}" \
              >/dev/null

          done < <(
            find . \
              -type d \( \
                -name .git -o \
                -name .github -o \
                -name .venv -o \
                -name venv -o \
                -name __pycache__ -o \
                -name node_modules \
              \) -prune \
              -o -type f \
                ! -name ".DS_Store" \
                ! -name "*.pyc" \
                -print0
          )

          echo "All files uploaded successfully."

          # Rechargement de l'application
          echo "Reloading webapp: ${DOMAIN}"

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Token ${TOKEN}" \
            "https://${HOST}/api/v0/user/${USER}/webapps/${DOMAIN}/reload/" \
            >/dev/null

          echo "Deployment successful!"
          echo "Website: https://${DOMAIN}/"
