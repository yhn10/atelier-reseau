
name: Deploy to PythonAnywhere

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PythonAnywhere secrets
        id: secrets
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
        run: |
          set -euo pipefail

          missing=""

          for v in PA_USERNAME PA_TOKEN PA_TARGET_DIR PA_WEBAPP_DOMAIN; do
            if [[ -z "${!v}" ]]; then
              missing="$missing $v"
            fi
          done

          if [[ -n "$missing" ]]; then
            echo "::warning::Secrets manquants :$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload and reload PythonAnywhere
        if: steps.secrets.outputs.ok == 'true'
        shell: bash
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          PA_TARGET_DIR: ${{ secrets.PA_TARGET_DIR }}
          PA_WEBAPP_DOMAIN: ${{ secrets.PA_WEBAPP_DOMAIN }}
          PA_HOST: ${{ secrets.PA_HOST }}

        run: |
          set -euo pipefail

          USER="$PA_USERNAME"
          TOKEN="$PA_TOKEN"
          TARGET_DIR="${PA_TARGET_DIR%/}"
          DOMAIN="$PA_WEBAPP_DOMAIN"
          HOST="${PA_HOST:-www.pythonanywhere.com}"

          echo "================================"
          echo "PythonAnywhere deployment"
          echo "================================"

          echo "Host: $HOST"
          echo "Username: $USER"
          echo "Target: $TARGET_DIR"

          # Vérification des paramètres
          if [[ "$TARGET_DIR" != /home/* ]]; then
            echo "::error::PA_TARGET_DIR doit commencer par /home/"
            exit 1
          fi

          if [[ "$USER" == *"/"* || "$USER" == *$'\n'* ]]; then
            echo "::error::Username invalide"
            exit 1
          fi

          if [[ "$HOST" == *"/"* || "$HOST" == *$'\n'* ]]; then
            echo "::error::Host invalide"
            exit 1
          fi

          if [[ "$DOMAIN" == *"/"* || "$DOMAIN" == *$'\n'* ]]; then
            echo "::error::Domaine invalide"
            exit 1
          fi

          # Upload récursif
          while IFS= read -r -d '' file; do

            rel="${file#./}"

            # Exclusions
            case "$rel" in
              .git/*|.github/*|.venv/*|venv/*|__pycache__/*|node_modules/*)
                continue
                ;;
              .gitignore|*.pyc|.DS_Store)
                continue
                ;;
            esac

            remote_path="${TARGET_DIR}/${rel}"

            # Construction et encodage de l'URL
            UPLOAD_URL=$(python3 - "$HOST" "$USER" "$remote_path" <<'PY'
          import sys
          from urllib.parse import quote, urlsplit

          host, user, path = sys.argv[1:]

          for name, value in [
              ("HOST", host),
              ("USER", user),
              ("PATH", path),
          ]:
              if any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit(f"{name} contient un caractère de contrôle")

          if not host or "/" in host or "://" in host:
              raise SystemExit("HOST invalide")

          if not user or "/" in user:
              raise SystemExit("USER invalide")

          if not path.startswith("/home/"):
              raise SystemExit("PATH invalide")

          url = (
              f"https://{host}/api/v0/user/"
              f"{quote(user, safe='')}/files/path"
              f"{quote(path, safe='/')}"
          )

          parsed = urlsplit(url)

          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("URL invalide")

          print(url)
          PY
          )

            echo ""
            echo "Uploading: $rel"

            # Diagnostic sans afficher le token
            python3 - "$UPLOAD_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit

          url = sys.argv[1]
          p = urlsplit(url)

          print("URL scheme:", p.scheme)
          print("URL host:", repr(p.netloc))
          print("URL path:", repr(p.path))

          if p.scheme != "https" or not p.netloc:
              raise SystemExit("URL incorrecte")
          PY

            # Envoi du fichier
            curl --globoff -sS --fail-with-body \
              --request POST \
              --header "Authorization: Token ${TOKEN}" \
              --form "content=@${file}" \
              --url "$UPLOAD_URL" \
              >/dev/null

            echo "Uploaded successfully: $rel"

          done < <(
            find . \
              -type d \( \
                -name .git -o \
                -name .github -o \
                -name .venv -o \
                -name venv -o \
                -name __pycache__ -o \
                -name node_modules \
              \) -prune \
              -o -type f \
                ! -name ".DS_Store" \
                ! -name "*.pyc" \
                -print0
          )

          echo ""
          echo "All files uploaded successfully."

          # Rechargement de l'application
          echo "Reloading webapp: $DOMAIN"

          RELOAD_URL="https://${HOST}/api/v0/user/${USER}/webapps/${DOMAIN}/reload/"

          curl --globoff -sS --fail-with-body \
            --request POST \
            --header "Authorization: Token ${TOKEN}" \
            --url "$RELOAD_URL" \
            >/dev/null

          echo ""
          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "================================"
          echo "Website: https://${DOMAIN}/"
